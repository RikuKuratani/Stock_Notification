name: Slack疎通テスト

# Slackに通知が届かないときの切り分け用。
# Actions タブから手動で実行すると、テストメッセージを1件だけ送る。
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 診断用のワークフローなので、依存関係は本番と同じものを入れて確実に動かす
      - run: pip install -r requirements.txt
      - name: テストメッセージを送信
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PYTHONPATH: src
        run: python -m monitor notify-test
