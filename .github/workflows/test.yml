name: テスト

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=src python -m pytest tests/ -q
      # 設定ファイルとスクレイパー登録の整合性を確認する
      - run: PYTHONPATH=src python -m monitor check
